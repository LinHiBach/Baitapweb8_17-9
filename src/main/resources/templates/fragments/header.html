<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark app-navbar py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold text-white fs-5"
               th:href="@{/products}">
                <span class="d-inline-flex align-items-center justify-content-center rounded-3 shadow-sm"
                      style="width: 38px; height: 38px; background: var(--primary-gradient);">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                        <line x1="12" y1="22.08" x2="12" y2="12"></line>
                    </svg>
                </span>
                <span>
                    Product<span style="color: #a5b4fc;">Manager</span>
                </span>
            </a>

            <div class="d-flex align-items-center gap-3 flex-wrap">
                <a class="btn btn-sm btn-outline-light" th:href="@{/products/ajax}">Product AJAX</a>
                <a class="btn btn-sm btn-outline-light" th:href="@{/categories}">Category AJAX</a>
                <a class="btn btn-sm btn-outline-light d-inline-flex align-items-center gap-2 px-3 py-2 rounded-3"
                   style="border-color: rgba(255,255,255,0.2); font-weight: 500;"
                   th:href="@{/products}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="14" y="14" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                    </svg>
                    <span>Products</span>
                </a>
                <a class="btn btn-sm btn-gradient-primary d-inline-flex align-items-center gap-1 px-3 py-2"
                   th:href="@{/products/create}">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Thêm mới</span>
                </a>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
