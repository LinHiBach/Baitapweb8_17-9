<!DOCTYPE html>
<html lang="vi" xmlns:th="https://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layouts/layout}">

<head>
    <title>Danh sách sản phẩm</title>
</head>

<body>
    <section layout:fragment="content">
        <!-- ALERT ERROR IF ANY -->
        <div class="alert alert-danger shadow-sm mb-4" role="alert" th:if="${uploadError}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="flex-shrink-0">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span th:text="${uploadError}"></span>
        </div>

        <!-- PAGE HEADER -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-1 text-muted" style="font-size: 0.85rem;">
                        <li class="breadcrumb-item"><a th:href="@{/products}" class="text-decoration-none text-muted">Trang chủ</a></li>
                        <li class="breadcrumb-item active text-primary fw-semibold" aria-current="page">Sản phẩm</li>
                    </ol>
                </nav>
                <div class="d-flex align-items-center gap-3">
                    <h2 class="h3 mb-0 fw-bold">Danh sách sản phẩm</h2>
                    <span class="badge badge-primary-soft">
                        <span th:text="${products.totalElements}">0</span> sản phẩm
                    </span>
                </div>
            </div>
            <div>
                <a class="btn btn-gradient-primary px-4 py-2" th:href="@{/products/create}">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>+ Thêm sản phẩm</span>
                </a>
            </div>
        </div>

        <!-- SEARCH & FILTER BAR -->
        <div class="app-card p-3 p-md-4 mb-4">
            <form class="row g-3 align-items-center" method="get" th:action="@{/products}">
                <div class="col-12 col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted" style="border-radius: var(--radius-md) 0 0 var(--radius-md); border-color: var(--border-color);">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0" name="keyword" th:value="${keyword}"
                            placeholder="Nhập tên sản phẩm cần tìm..." style="border-radius: 0 var(--radius-md) var(--radius-md) 0;">
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="d-flex align-items-center gap-2">
                        <label class="text-muted small text-nowrap mb-0 d-none d-sm-inline">Hiển thị:</label>
                        <select class="form-select" name="size">
                            <option value="5" th:selected="${size == 5}">5 mục / trang</option>
                            <option value="10" th:selected="${size == 10}">10 mục / trang</option>
                            <option value="20" th:selected="${size == 20}">20 mục / trang</option>
                        </select>
                    </div>
                </div>
                <div class="col-6 col-md-3 d-flex gap-2 justify-content-end">
                    <button class="btn btn-primary d-inline-flex align-items-center justify-content-center gap-2 px-3 w-100" type="submit" style="background-color: var(--primary-color); border-color: var(--primary-color); border-radius: var(--radius-md); font-weight: 600;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        Tìm kiếm
                    </button>
                    <a th:if="${keyword != null and !keyword.isEmpty()}" th:href="@{/products(size=${size})}" class="btn btn-soft-secondary d-inline-flex align-items-center justify-content-center" title="Bỏ lọc">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </a>
                </div>
            </form>
        </div>

        <!-- TABLE SECTION -->
        <div class="custom-table-container mb-4">
            <div class="table-responsive">
                <table class="table custom-table mb-0 align-middle">
                    <thead>
                        <tr>
                            <th style="width: 70px;" class="text-center">ID</th>
                            <th style="width: 110px;" class="text-center">Ảnh</th>
                            <th>Tên sản phẩm</th>
                            <th style="width: 140px;">Giá</th>
                            <th style="width: 110px;" class="text-center">Số lượng</th>
                            <th>Mô tả</th>
                            <th style="width: 170px;" class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products.content}">
                            <td class="text-center">
                                <span class="badge bg-light text-secondary border font-monospace" th:text="${product.id}">1</span>
                            </td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center align-items-center">
                                    <img th:each="image : ${product.images}" th:if="${image.primary}"
                                        th:src="@{/uploads/products/{filename}(filename=${image.imageUrl})}" th:alt="${product.name}" loading="lazy"
                                        class="product-img-thumb" style="width: 90px; height: 70px; object-fit: contain;">

                                    <span th:if="${#lists.isEmpty(product.images)}" class="badge bg-light text-muted border py-2 px-2" style="font-size: 0.75rem;">
                                        Chưa có ảnh
                                    </span>
                                </div>
                            </td>
                            <td>
                                <div class="fw-semibold text-dark fs-6" th:text="${product.name}">Tên sản phẩm</div>
                            </td>
                            <td>
                                <div class="fw-bold text-primary">
                                    <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}">0.00</span>
                                    <span class="small fw-normal text-muted">VNĐ</span>
                                </div>
                            </td>
                            <td class="text-center">
                                <span class="badge" th:classappend="${product.quantity > 5 ? 'badge-success-soft' : 'badge-primary-soft'}"
                                      th:text="${product.quantity}">
                                    0
                                </span>
                            </td>
                            <td>
                                <div class="text-muted small text-truncate" style="max-width: 260px;" th:title="${product.description}" th:text="${product.description}">
                                    Mô tả ngắn
                                </div>
                            </td>
                            <td class="text-center">
                                <div class="d-flex justify-content-center gap-2">
                                    <a class="btn btn-sm btn-soft-warning px-3 py-1 d-inline-flex align-items-center gap-1" th:href="@{/products/edit/{id}(id=${product.id})}">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                        </svg>
                                        Sửa
                                    </a>
                                    <a class="btn btn-sm btn-soft-danger px-3 py-1 d-inline-flex align-items-center gap-1" th:href="@{/products/delete/{id}(id=${product.id})}"
                                        onclick="return confirm('Bạn có chắc muốn xóa?')">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="3 6 5 6 21 6"></polyline>
                                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                        </svg>
                                        Xóa
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- EMPTY STATE -->
            <div class="alert alert-warning m-4 d-flex align-items-center justify-content-center gap-3 py-4" th:if="${products.totalElements == 0}">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>Không tìm thấy sản phẩm.</span>
            </div>
        </div>

        <!-- PAGINATION SECTION -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3 mt-4" th:if="${products.totalPages > 1}">
            <div class="text-muted small">
                Trang <span class="fw-semibold text-dark" th:text="${products.number + 1}">1</span> / <span class="fw-semibold text-dark" th:text="${products.totalPages}">1</span>
                (Tổng số <span th:text="${products.totalElements}"></span> sản phẩm)
            </div>
            <nav>
                <ul class="pagination justify-content-center mb-0">
                    <!-- Previous -->
                    <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/products(
                            page=${products.number - 1},
                            size=${size},
                            keyword=${keyword}
                        )}">
                            Previous
                        </a>
                    </li>
                    <!-- Page number -->
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                        th:classappend="${i == products.number} ? 'active'">
                        <a class="page-link" th:text="${i + 1}" th:href="@{/products(
                            page=${i},
                            size=${size},
                            keyword=${keyword}
                        )}">
                            1
                        </a>
                    </li>
                    <!-- Next -->
                    <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/products(
                            page=${products.number + 1},
                            size=${size},
                            keyword=${keyword}
                        )}">
                            Next
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </section>
</body>

</html>
