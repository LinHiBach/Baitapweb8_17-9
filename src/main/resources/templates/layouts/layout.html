<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - Product Manager">
        Product Manager
    </title>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --primary-hover: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
            --primary-color: #4f46e5;
            --primary-light: #eef2ff;
            --accent-emerald: #10b981;
            --accent-emerald-light: #ecfdf5;
            --accent-amber: #f59e0b;
            --accent-amber-light: #fffbeb;
            --accent-rose: #ef4444;
            --accent-rose-light: #fef2f2;
            --surface-bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 25px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
            --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.05);
            --transition-base: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--surface-bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            letter-spacing: -0.01em;
            -webkit-font-smoothing: antialiased;
        }

        main {
            flex: 1 0 auto;
        }

        /* Typography & Headings */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #0f172a;
        }

        /* Custom Cards */
        .app-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: var(--transition-base);
            overflow: hidden;
        }
        .app-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--border-hover);
        }

        /* Custom Buttons */
        .btn-gradient-primary {
            background: var(--primary-gradient);
            color: #ffffff !important;
            border: none;
            font-weight: 600;
            border-radius: var(--radius-md);
            padding: 0.625rem 1.25rem;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: var(--transition-base);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        .btn-gradient-primary:hover {
            background: var(--primary-hover);
            color: #ffffff !important;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
        }
        .btn-gradient-primary:active {
            transform: translateY(0);
        }

        .btn-soft-primary {
            background: var(--primary-light);
            color: var(--primary-color) !important;
            border: 1px solid transparent;
            font-weight: 600;
            border-radius: var(--radius-md);
            transition: var(--transition-base);
            text-decoration: none;
        }
        .btn-soft-primary:hover {
            background: #e0e7ff;
            color: #3730a3 !important;
        }

        .btn-soft-warning {
            background: var(--accent-amber-light);
            color: #b45309 !important;
            border: 1px solid rgba(245, 158, 11, 0.2);
            font-weight: 600;
            border-radius: var(--radius-sm);
            transition: var(--transition-base);
            text-decoration: none;
        }
        .btn-soft-warning:hover {
            background: #fde68a;
            color: #92400e !important;
        }

        .btn-soft-danger {
            background: var(--accent-rose-light);
            color: #b91c1c !important;
            border: 1px solid rgba(239, 68, 68, 0.2);
            font-weight: 600;
            border-radius: var(--radius-sm);
            transition: var(--transition-base);
            text-decoration: none;
        }
        .btn-soft-danger:hover {
            background: #fecaca;
            color: #991b1b !important;
        }

        .btn-soft-secondary {
            background: #f1f5f9;
            color: #475569 !important;
            border: 1px solid var(--border-color);
            font-weight: 600;
            border-radius: var(--radius-md);
            transition: var(--transition-base);
            text-decoration: none;
        }
        .btn-soft-secondary:hover {
            background: #e2e8f0;
            color: #1e293b !important;
        }

        /* Form Controls */
        .form-control, .form-select {
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border-color);
            padding: 0.65rem 0.95rem;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #ffffff;
            transition: var(--transition-base);
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
            outline: none;
        }
        .form-label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #334155;
            margin-bottom: 0.4rem;
        }

        /* Modern Table */
        .custom-table-container {
            background: #ffffff;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        .custom-table {
            margin-bottom: 0;
            vertical-align: middle;
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
        }
        .custom-table thead {
            background: #0f172a;
            color: #ffffff;
        }
        .custom-table thead th {
            font-weight: 600;
            font-size: 0.825rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.95rem 1.25rem;
            border: none;
            background: transparent;
            color: #94a3b8;
        }
        .custom-table tbody tr {
            transition: background-color 0.15s ease;
        }
        .custom-table tbody tr:hover {
            background-color: #f8fafc;
        }
        .custom-table tbody td {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border-color);
            color: #334155;
            font-size: 0.925rem;
        }

        /* Badges */
        .badge-primary-soft {
            background-color: var(--primary-light);
            color: var(--primary-color);
            font-weight: 600;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.78rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .badge-success-soft {
            background-color: var(--accent-emerald-light);
            color: #047857;
            font-weight: 600;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.78rem;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        /* Pagination Modern */
        .pagination {
            gap: 0.375rem;
            margin-bottom: 0;
        }
        .pagination .page-item .page-link {
            border-radius: var(--radius-sm) !important;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.875rem;
            padding: 0.5rem 0.85rem;
            transition: var(--transition-base);
            background-color: #ffffff;
        }
        .pagination .page-item.active .page-link {
            background: var(--primary-gradient);
            border-color: transparent;
            color: #ffffff;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3);
        }
        .pagination .page-item.disabled .page-link {
            background-color: #f8fafc;
            color: #94a3b8;
            border-color: #e2e8f0;
        }
        .pagination .page-item:not(.active):not(.disabled) .page-link:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
            color: var(--primary-color);
        }

        /* Alerts */
        .alert {
            border-radius: var(--radius-md);
            border: 1px solid transparent;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .alert-danger {
            background-color: var(--accent-rose-light);
            border-color: #fca5a5;
            color: #991b1b;
        }
        .alert-success {
            background-color: var(--accent-emerald-light);
            border-color: #86efac;
            color: #065f46;
        }
        .alert-warning {
            background-color: var(--accent-amber-light);
            border-color: #fde68a;
            color: #92400e;
        }

        /* Glass / Nav */
        .app-navbar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* Product Image Container in Table */
        .product-img-thumb {
            width: 76px;
            height: 60px;
            object-fit: contain;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 3px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-base);
        }
        .product-img-thumb:hover {
            transform: scale(1.08);
            box-shadow: var(--shadow-md);
            border-color: var(--primary-color);
        }

        /* Upload Area */
        .file-upload-wrapper {
            border: 2px dashed #cbd5e1;
            border-radius: var(--radius-lg);
            background: #f8fafc;
            padding: 1.75rem 1.25rem;
            text-align: center;
            transition: var(--transition-base);
            position: relative;
        }
        .file-upload-wrapper:hover {
            border-color: var(--primary-color);
            background: #eef2ff;
        }

        /* Image Card in Form */
        .img-gallery-card {
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: #ffffff;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: var(--transition-base);
        }
        .img-gallery-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
            border-color: #cbd5e1;
        }
        .img-gallery-preview {
            width: 158px;
            height: 140px;
            object-fit: contain;
            background: #fafafa;
            padding: 6px;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}">
    </div>

    <!-- CONTENT -->
    <main class="container py-4 my-2" layout:fragment="content">
    </main>

    <!-- FOOTER -->
    <div th:replace="~{fragments/footer :: footer}">
    </div>

    <!-- Bootstrap 5.3.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
